name: Durable financial research validation

on:
  pull_request:
    paths:
      - "python-backend/**"
      - "src/**"
      - "web/**"
      - "scripts/**"
      - "playwright.config.ts"
      - "contracts/**"
      - "tests/**"
      - "package.json"
      - "tsconfig*.json"
      - "bun.lock"
      - ".github/workflows/durable-financial-research.yml"
  workflow_dispatch:

jobs:
  backend-and-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r requirements-dev.txt
      - name: Syntax and undefined-name lint
        run: ruff check .
      - name: Versioned contract drift check
        run: PYTHONPATH=. python scripts/export_contracts.py --check
      - name: Compile modules
        run: python -m compileall -q app dexter_py tests
      - name: Unit, API, Redis multi-worker invariant tests
        run: python -m pytest -q
      - run: bun run build:web
        working-directory: .
      - run: bunx playwright install --with-deps chromium
        working-directory: .
      - run: bun run test:web
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/
            playwright-report/

  bun-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run typecheck:web
      - run: bun run build:web


  graph-neo4j-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.33-community
        env:
          NEO4J_AUTH: neo4j/disposable-ci-password
        ports:
          - "7687:7687"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p disposable-ci-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GRAPH_TEST_DISPOSABLE: "yes"
      TEST_NEO4J_URI: bolt://127.0.0.1:7687
      TEST_NEO4J_PASSWORD: disposable-ci-password
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install graph integration dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Exercise graph models, persistence and authorized API
        run: python -m pytest -q tests/test_graph_models.py tests/test_graph_repository.py tests/test_graph_api.py
