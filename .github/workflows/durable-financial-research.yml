name: Durable financial research validation

on:
  pull_request:
    paths:
      - "python-backend/**"
      - "src/**"
      - ".github/workflows/durable-financial-research.yml"
  workflow_dispatch:

jobs:
  backend-and-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Compile modules
        run: python -m compileall -q app dexter_py tests
      - name: Unit, API, Redis multi-worker invariant tests
        run: python -m pytest -q

  bun-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
