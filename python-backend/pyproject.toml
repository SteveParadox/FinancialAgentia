[project]
name = "dexter-py"
version = "0.1.0"
description = "Python port/skeleton of Dexter backend"
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
# Catch syntax, undefined names and invalid control flow across the legacy tree.
select = ["E9", "F63", "F7", "F82"]
